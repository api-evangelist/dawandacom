name: DaWanda.com
description: DaWanda.com was a German online marketplace for handmade, unique, and custom-made products,
  founded in 2006 in Berlin. It connected independent makers and small designers with buyers across
  Germany and Europe, comparable to Etsy in the DACH region. DaWanda ceased operations on 30 August 2018
  and partnered with Etsy to migrate its sellers and buyers; the www.dawanda.com domain now redirects to
  Etsy Germany. This profile was surfaced as a portfolio company of Insight Partners and added to the API
  Evangelist network as a stub. No public developer program or API surface was found during enrichment;
  the company is defunct and retained here as a historical/portfolio record.
